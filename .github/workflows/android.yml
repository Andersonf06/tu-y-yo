name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'logo/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Incluir la configuración de Firebase
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            node -e 'const c=JSON.parse(process.env.FIREBASE_CONFIG);const k=["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"];const o={};for(const x of k)if(typeof c[x]==="string")o[x]=c[x];if(!o.apiKey||!o.projectId||!o.appId)throw new Error("FIREBASE_CONFIG incompleto");require("fs").writeFileSync("www/firebase-config.js","window.TUYYO_FIREBASE = "+JSON.stringify(o)+";\n")'
            echo "Configuración de Firebase incluida: la vinculación usa códigos de 6 letras."
          else
            echo "::warning::Sin variable FIREBASE_CONFIG: al vincular, la app pedirá pegar la configuración."
          fi

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tuyyo.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/tuyyo.jks" >> "$GITHUB_ENV"
          else
            echo "Usando la firma pública del repositorio (android/app/firma-publica.jks)."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../TU-Y-YO.apk
          if [ -n "$KEYSTORE_PATH" ]; then rm -f "$KEYSTORE_PATH"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: TU-Y-YO-apk
          path: TU-Y-YO.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TU Y YO 1.0.${{ github.run_number }}
          body: |
            Descarga **TU-Y-YO.apk** en tu celular Android y ábrela para instalar.
            Si Android lo pide, permite "Instalar apps de origen desconocido" para tu navegador o administrador de archivos.
          files: TU-Y-YO.apk
          make_latest: true
